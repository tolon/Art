[package]
name = "amiga-retro-toolkit"
version = "0.1.0"
description = "ART — The Swiss Army Knife for Amiga Files"
authors = ["tolon"]
edition = "2021"
# Raised from 1.77 on 2026-08-12, deliberately and for one reason: 7z support.
# The maintained `sevenz-rust2` requires 1.93, and the newest release that
# still built on 1.77 was fourteen minor versions behind — an old LZMA decoder
# is not a good thing to point at untrusted files, and LZMA is where that
# class of bug lives. CI builds on `stable` (`dtolnay/rust-toolchain@stable`),
# so nothing in the pipeline pins an older compiler.
rust-version = "1.93"
# Declared so `cargo deny check licenses` can see it: without a licence field
# the crate is reported as unlicensed against its own allow-list, which is how
# that check was failing before 2026-08-12.
#
# GPL-3.0-or-later, decided 2026-08-12. The repository said MIT until then; the
# public repository was created under GPL-3.0 and that is the licence the
# project ships under. `-or-later` follows the wording the licence's own
# "how to apply" section recommends.
license = "GPL-3.0-or-later"
repository = "https://github.com/tolon/Art"

# Tauri 2 requires the lib to be a cdylib/staticlib for cross-binary use
# (and an rlib so the binary target and tests can reuse it).
[lib]
name = "art_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
log = "0.4"
delharc = { version = "0.8", default-features = false, features = ["std", "lh1", "lz"] }

# Repository mirrors (§41.5.3). Blocking on purpose: downloads already run on
# their own job threads, so an async runtime would buy nothing.
#
# `gzip` is deliberately OFF. Transparent decompression would make the bytes
# ART writes differ from the bytes the server counted, which breaks both the
# resume offset and the size gate — the two things the download pipeline relies
# on to know it received the right file.
#
# Pinned exactly. The original reason — ureq 3.4 raised its MSRV to 1.85 and
# this crate promised 1.77 — no longer applies now that the MSRV is 1.93, so
# the pin is now only "not yet re-verified": moving the HTTP client means
# re-running the transport tests and the live-mirror checks that found ART-030,
# and that is its own change rather than a side effect of adding 7z support.
ureq = { version = "=3.2.1", default-features = false, features = [
    "rustls",
    "rustls-webpki-roots",
] }
# Dragging a file OUT of the window into Explorer. Windows has no way to do
# that from a webview, so it needs a native plugin (see ART-kaynak-listesi §11).
tauri-plugin-drag = "2.1.1"
# ZIP, read-only, behind `core/archive`'s one security gate.
#
# `default-features = false` on purpose, and the feature list is the whole
# decision: ART only ever *reads* an archive, and every enabled feature is more
# code parsing a hostile file inside this process. Off, deliberately: `aes-crypto`
# and `pbkdf2` (ART does not open encrypted archives — it says so instead),
# `bzip2`/`zstd`/`lzma`/`xz`/`deflate64` (not what Amiga-era ZIPs use, and each
# is another decompressor), `deflate-zopfli` (a *compressor*), and the date
# crates. Deflate through `flate2` + `zlib-rs` keeps it pure Rust with no C
# toolchain in the build.
#
# 8.x needs rustc 1.88; it was held at 4.6 for exactly as long as the old MSRV
# lasted, and arrived with the bump above.
zip = { version = "8", default-features = false, features = [
    "deflate-flate2",
    "deflate-flate2-zlib-rs",
] }

# 7z, read-only, behind the same gate as ZIP and LHA.
#
# `default-features = false` for the same reason: ART reads and never writes an
# archive. The dependency surface is two crates — `crc32fast` and `lzma-rust2`
# — and LZMA is the whole point of it.
#
# **This crate is why the MSRV moved to 1.93** (see `rust-version` above). The
# newest release that still built on 1.77 was fourteen minor versions behind,
# and an old LZMA decoder is precisely the thing not to point at files
# strangers wrote.
sevenz-rust2 = { version = "0.21.4", default-features = false }

# FAT32, and the first filesystem ART **writes** that is not an Amiga one.
#
# A PiStorm card boots the Raspberry Pi from a FAT32 partition — the Emu68
# kernel, a Kickstart image, `config.txt`, `cmdline.txt` — and the Amiga lives
# in the rest of the card. So SD-1's G2 has to create a FAT32 filesystem and
# put files in it. The gap analysis named this crate rather than hand-rolling
# one, and that is the right call for a filesystem whose only job is to be read
# by somebody else's firmware: a formatter of one's own would be correct in
# exactly the cases one thought to test.
#
# `default-features = false`, and the feature list is the decision:
#
# - `std` for `io::Read`/`Write`/`Seek`, which is how ART hands it a region of
#   an image file.
# - `alloc` for long filenames. `config_caffeineos.txt` is not an 8.3 name, and
#   a multiboot card is a folder full of names like it.
# - **`chrono` off, deliberately.** It is the default, and it would pull a date
#   library in to stamp every file with the moment it was written. ART wants
#   the opposite: a build that produces the same bytes twice is a build a
#   manifest can describe (G7), and "when was this card made" is the manifest's
#   answer to give, not sixty timestamps scattered through a filesystem.
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }

# PFS3, so ART can write the filesystem a real PiStorm card uses. Pure Rust:
# its whole dependency tree is `byteorder` + `thiserror`, it launches nothing
# and declares no OS dependency, which is what lets it live inside `core/`.
# LGPL-3.0-or-later, compatible with ART's GPL-3.0-or-later — see the note
# beside it in `deny.toml`'s allow list for the cost that acceptance carries.
#
# Pinned exactly, the same way `ureq` above is: `core/preload/native.rs`'s
# `NativeFormatter::probe()` reports this version number as which
# implementation did the work, and a `cargo update` silently drifting that
# past what `probe()` claims would make the report lie about itself. A test
# in `native.rs` checks this line's string literally, so drift fails the
# build rather than the user's trust in the report.
libpfs3 = "=0.1.3"

[dev-dependencies]
# The 7z *encoder*, for building test fixtures only. ART ships no archives, so
# every fixture is written at runtime — and a 7z cannot be hand-assembled the
# way a level-0 LHA header can, so the writer has to come from somewhere.
#
# In `[dev-dependencies]` on purpose: cargo unifies features here only when
# building tests, so `cargo build` still compiles the decoder alone and the
# shipped application carries no LZMA encoder.
sevenz-rust2 = { version = "0.21.4", default-features = false, features = ["compress"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
