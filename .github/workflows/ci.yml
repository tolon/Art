name: CI

on:
  push:
    # Phase work happens on its own branch and lands on `main` through a merge
    # (CLAUDE.md). Watching only `main` meant a phase's whole history reached
    # CI for the first time *as* it was being released — which is the moment a
    # red build is least useful. Every branch runs now.
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm lint

      # These were missing entirely: 400-odd tests, including the en/tr parity
      # check and the two that prove every `Phrase` and every registry key
      # resolves to a real catalogue leaf. A typo there renders a raw dotted
      # key on screen, and `pnpm lint` cannot see it.
      - name: Frontend tests
        run: pnpm test

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        # Must stay blocking: clippy's `correctness` group catches real bugs
        # (it once flagged a duplicated size check that disabled HD floppy
        # geometry entirely, hidden for months behind continue-on-error).
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ART's own tests cannot catch a format mistake its reader and writer
      # share — a wrong checksum, a field one longword out of place, a bitmap
      # laid out backwards. All four of ART-032..035 round-tripped through ART
      # perfectly and were rejected by every real Amiga tool. This step is the
      # only thing that would have caught them, so it is blocking.
      #
      # It runs both directions: ART writes and amitools reads, amitools writes
      # and ART reads. A reader and a writer that agree with each other and
      # with nothing else is exactly what those four bugs were.
      - name: Install the independent oracle
        run: pip install amitools

      - name: Cross-check ART's images against amitools
        run: python scripts/oracle-check.py

      # The Kickstart table is generated from the Remus split database
      # amitools ships (ART-104), so it can drift the moment that dependency
      # updates. Verify mode reads the database and compares — a difference is
      # worth seeing in a diff rather than absorbing silently, and it needs no
      # ROM of its own, so it runs everywhere.
      - name: Check the ROM table against its source
        run: python scripts/rom-table-check.py

      # The palette is a measurement, not a preference (ART-140). The light
      # theme once shipped 2.20:1 text inside its own success badge because it
      # had been judged by eye. This reads theme.css and fails below the
      # threshold — pure Python, no browser, so unlike zoom-check.py it runs
      # here.
      - name: Check both themes for contrast
        run: python scripts/contrast-check.py --quiet

      # docs/licenses.md claims this runs; keep the claim true. deny.toml
      # rejects incompatible licences and known advisories (spec §67).
      #
      # Run as a binary, not as `EmbarkStudios/cargo-deny-action`. That action
      # is a *container* action, containers only run on Linux runners, and this
      # job runs on Windows -- so the step failed with "Container action is only
      # supported on Linux" on every single push since it was added, and took
      # the build and the MSI artifact down with it. A blocking gate that can
      # never pass is not a gate.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Dependency licences & advisories
        working-directory: src-tauri
        run: cargo deny check

      - name: Build application
        run: pnpm tauri build
        env:
          # Avoid bundling during CI on PRs to save time; comment out to enable.
          TAURI_BUNDLE: "true"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ART-windows-msi
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
