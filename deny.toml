# cargo-deny configuration
#
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
# Permissive licenses used by typical Rust/Tauri dependencies.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # `webpki-roots` — Mozilla's CA trust list, reached through `ureq`'s
  # rustls-webpki-roots feature. CDLA-Permissive-2.0 is a permissive *data*
  # licence (it is a list of certificates, not code) with no copyleft and no
  # attribution requirement beyond the notice. Added when a lockfile refresh
  # brought webpki-roots 1.0.x in and this check started failing on it.
  "CDLA-Permissive-2.0",
]
# Confidence threshold for license detection.
confidence-threshold = 0.8

# Per-crate exceptions go here when a dependency carries an
# uncommon-but-permissive licence. There are none today, and the table is left
# out rather than left empty: current cargo-deny requires a `crate` field in
# every `[[licenses.exceptions]]` entry, so an empty placeholder is a config
# error that fails the whole check before it reads a single licence.
#
# [[licenses.exceptions]]
# crate = "ring"
# allow = ["LicenseRef-ring"]

[advisories]
# Flag unmaintained crates as warnings (not hard errors) during Phase 0.
unmaintained = "workspace"
# yanked = "deny"

[bans]
# Warn on duplicate crate versions (common in large dependency trees).
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only allow crates from crates.io.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
