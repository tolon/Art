# cargo-deny configuration
#
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
# Permissive licenses used by typical Rust/Tauri dependencies.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]
# Confidence threshold for license detection.
confidence-threshold = 0.8

[[licenses.exceptions]]
# Allow specific crates with uncommon-but-permissive licenses here if needed.
# Example (uncomment if a dependency requires it):
# name = "ring"
# version = "*"
# allow = ["LicenseRef-ring"]

[advisories]
# Flag unmaintained crates as warnings (not hard errors) during Phase 0.
unmaintained = "workspace"
# yanked = "deny"

[bans]
# Warn on duplicate crate versions (common in large dependency trees).
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only allow crates from crates.io.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
